name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/Wrkzg.Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/Wrkzg.Frontend
        run: npm ci --ignore-scripts

      - name: TypeScript Check
        working-directory: src/Wrkzg.Frontend
        run: npx tsc --noEmit

      - name: Build Frontend
        working-directory: src/Wrkzg.Frontend
        run: npm run build

      - name: Restore .NET
        run: dotnet restore wrkzg.sln

      - name: Build .NET
        run: dotnet build wrkzg.sln --no-restore -c Release

      - name: Run Tests
        run: dotnet test wrkzg.sln --no-build -c Release --verbosity normal
